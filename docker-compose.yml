services:
  page-scraper:
    container_name: page-scraper
    build: .
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TZ: ${TZ:-Europe/London}
      DATA_DIR: /data
      OUTPUT_ROOT: /output
      CONCURRENCY: ${CONCURRENCY:-1}
      VIEWPORT_WIDTH: ${VIEWPORT_WIDTH:-1440}
      VIEWPORT_HEIGHT: ${VIEWPORT_HEIGHT:-900}
      MAX_HEIGHT_PX: ${MAX_HEIGHT_PX:-50000}
      STABLE_MS: ${STABLE_MS:-5000}
      TIMEOUT_MS: ${TIMEOUT_MS:-30000}
      VIDEO: ${VIDEO:-true}
      VIDEO_FPS: ${VIDEO_FPS:-5}
      VIDEO_SECONDS: ${VIDEO_SECONDS:-30}
      API_TOKEN: ${API_TOKEN:-}
      ON_COMPLETE_HOOK: ${ON_COMPLETE_HOOK:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${OUTPUT_DIR:-./output}:/output
    user: "0:0"
    shm_size: 256mb
    mem_limit: 2500m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
