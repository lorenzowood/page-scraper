[project]
name = "page-scraper"
version = "0.1.0"
description = "Local full-page PNG + live DOM capture service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "playwright==1.62.0",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
]

[project.scripts]
page-scraper = "pagecapture.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pagecapture*"]

[tool.setuptools.package-data]
pagecapture = ["static/*"]
